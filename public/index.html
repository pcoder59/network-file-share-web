<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Transfer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 600px;
      width: 100%;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .upload-section {
      margin-bottom: 30px;
    }

    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
      width: 100%;
    }

    #fileInput {
      display: none;
    }

    .upload-btn {
      display: block;
      width: 100%;
      padding: 15px;
      background: #667eea;
      color: white;
      border: 2px dashed #667eea;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.3s;
      font-weight: bold;
    }

    .upload-btn:hover {
      background: #764ba2;
      border-color: #764ba2;
    }

    .file-name {
      margin-top: 10px;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 6px;
      color: #333;
      font-size: 14px;
      display: none;
    }

    #uploadBtn {
      width: 100%;
      padding: 12px;
      background: #48bb78;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.3s;
    }

    #uploadBtn:hover {
      background: #38a169;
    }

    #uploadBtn:disabled {
      background: #cbd5e0;
      cursor: not-allowed;
    }

    .files-section {
      margin-top: 30px;
    }

    .files-section h2 {
      font-size: 18px;
      color: #333;
      margin-bottom: 15px;
    }

    #filesList {
      list-style: none;
    }

    .file-item {
      background: #f9f9f9;
      padding: 12px 15px;
      margin-bottom: 8px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid #667eea;
    }

    .file-item a {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
      flex: 1;
    }

    .file-item a:hover {
      text-decoration: underline;
    }

    .empty-message {
      color: #999;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
      border-radius: 6px;
    }

    .progress {
      margin-top: 10px;
      display: none;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #e0e0e0;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #48bb78;
      width: 0%;
      transition: width 0.3s;
    }

    .message {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: none;
    }

    .message.success {
      background: #c6f6d5;
      color: #22543d;
      display: block;
    }

    .message.error {
      background: #fed7d7;
      color: #742a2a;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📁 File Transfer</h1>
    <p class="subtitle">Share Files Between Devices on Your Network</p>

    <div id="message" class="message"></div>

    <div class="upload-section">
      <div class="file-input-wrapper">
        <label for="fileInput" class="upload-btn">
          📤 Click to select file
        </label>
        <input type="file" id="fileInput">
      </div>
      <div class="file-name" id="fileName"></div>
      <button id="uploadBtn" disabled>Upload File</button>
      <div class="progress" id="progress">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
    </div>

    <div class="files-section">
      <h2>Available Files</h2>
      <ul id="filesList">
        <li class="empty-message">No files uploaded yet</li>
      </ul>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('fileName');
    const uploadBtn = document.getElementById('uploadBtn');
    const filesList = document.getElementById('filesList');
    const message = document.getElementById('message');
    const progress = document.getElementById('progress');
    const progressFill = document.getElementById('progressFill');

    // Show selected file name
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        fileName.textContent = `📄 Selected: ${file.name}`;
        fileName.style.display = 'block';
        uploadBtn.disabled = false;
      } else {
        fileName.style.display = 'none';
        uploadBtn.disabled = true;
      }
    });

    // Upload file
    uploadBtn.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('file', file);

      uploadBtn.disabled = true;
      progress.style.display = 'block';
      message.className = 'message';

      try {
        const xhr = new XMLHttpRequest();
        xhr.upload.addEventListener('progress', (e) => {
          const percent = (e.loaded / e.total) * 100;
          progressFill.style.width = percent + '%';
        });

        xhr.addEventListener('load', () => {
          if (xhr.status === 200) {
            showMessage('✓ File uploaded successfully!', 'success');
            fileInput.value = '';
            fileName.style.display = 'none';
            uploadBtn.disabled = true;
            progressFill.style.width = '0%';
            setTimeout(() => {
              progress.style.display = 'none';
              loadFiles();
            }, 1000);
          }
        });

        xhr.addEventListener('error', () => {
          showMessage('✗ Upload failed. Try again.', 'error');
          uploadBtn.disabled = false;
          progress.style.display = 'none';
        });

        xhr.open('POST', '/upload');
        xhr.send(formData);
      } catch (err) {
        showMessage('✗ Error: ' + err.message, 'error');
        uploadBtn.disabled = false;
        progress.style.display = 'none';
      }
    });

    // Load and display files
    async function loadFiles() {
      try {
        const response = await fetch('/files');
        const files = await response.json();

        filesList.innerHTML = '';
        if (files.length === 0) {
          filesList.innerHTML = '<li class="empty-message">No files uploaded yet</li>';
        } else {
          files.forEach(file => {
            const li = document.createElement('li');
            li.className = 'file-item';
            li.innerHTML = `
              <a href="/download/${file}" download>${file}</a>
            `;
            filesList.appendChild(li);
          });
        }
      } catch (err) {
        console.error('Error loading files:', err);
      }
    }

    function showMessage(text, type) {
      message.textContent = text;
      message.className = 'message ' + type;
      setTimeout(() => {
        message.className = 'message';
      }, 3000);
    }

    // Load files on page load
    loadFiles();
  </script>
</body>
</html>
