<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Transfer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>📁 File Transfer</h1>
    <p class="subtitle">Share Files Between Devices on Your Network</p>

    <div id="message" class="message"></div>

    <div class="upload-section">
      <div class="file-input-wrapper">
        <label for="fileInput" class="upload-btn">
          📤 Click to select file
        </label>
        <input type="file" id="fileInput" multiple>
      </div>
      <div class="file-name" id="fileName"></div>
      <button id="uploadBtn" disabled>Upload File</button>
      <div class="progress" id="progress">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
    </div>

    <div class="files-section">
      <h2>Available Files</h2>

      <div class="search-section">
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="🔍 Search files by name..."
        >
        <button id="clearSearchBtn" class="clear-search-btn" style="display: none;">✕ Clear</button>
        <div id="searchResults" class="search-results"></div>
      </div>

      <div id="filesLoader" class="loader-container" style="display: none;">
        <div class="spinner"></div>
        <p>Loading files...</p>
      </div>
      
      <div id="selectedActionsContainer" class="delete-selected-container" style="display: none;">
        <div class="selected-info">
          <span id="selectedCount">0 files selected</span>
          <span id="selectedSize">0 B</span>
        </div>
        <button id="deleteSelectedBtn" class="delete-selected-btn">🗑️ Delete Selected</button>
        <button id="downloadSelectedBtn" class="download-selected-btn">⬇️ Download Selected</button>
        <button id="clearSelectionBtn" class="clear-selection-btn">✕ Clear Selection</button>
      </div>

      <ul id="filesList">
        <li class="empty-message">No files uploaded yet</li>
      </ul>

      <div class="pagination" id="pagination" style="display: none;">
        <button id="prevBtn" class="pagination-btn">← Previous</button>
        
        <div class="page-info">
          <span id="pageInfo">Page 1</span>
        </div>
        
        <div class="go-to-page">
          <input type="number" id="pageInput" class="page-input" min="1" placeholder="Go to page">
          <button id="goToPageBtn" class="go-to-page-btn">Go</button>
        </div>
        
        <button id="nextBtn" class="pagination-btn">Next →</button>
      </div>
    </div>

  <script src="script.js"></script>
</body>
</html>
